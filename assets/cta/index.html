<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:block;src:url('assets/fonts/Inter-400.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:block;src:url('assets/fonts/Inter-500.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:block;src:url('assets/fonts/Inter-600.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:block;src:url('assets/fonts/Inter-700.woff2') format('woff2');}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:block;src:url('assets/fonts/JetBrainsMono-400.woff2') format('woff2');}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:600;font-display:block;src:url('assets/fonts/JetBrainsMono-600.woff2') format('woff2');}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:block;src:url('assets/fonts/JetBrainsMono-700.woff2') format('woff2');}
@font-face{font-family:'Sora';font-style:normal;font-weight:700;font-display:block;src:url('assets/fonts/Sora-700.woff2') format('woff2');}
@font-face{font-family:'Sora';font-style:normal;font-weight:800;font-display:block;src:url('assets/fonts/Sora-800.woff2') format('woff2');}

  :root{
    --bg:#0D1321; --bg2:#1D2D44; --bg3:#3E5C76;
    --fg:#F0EBD8; --muted:#748CAB; --accent:#FFC300; --accent2:#FCA311;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
  body{font-family:Inter,sans-serif;color:var(--fg)}
  #root{position:relative;width:1920px;height:1080px;background:var(--bg);overflow:hidden}

  .bg-layer{position:absolute;inset:0;pointer-events:none}
  #glow{position:absolute;top:-360px;left:-260px;width:1200px;height:1200px;border-radius:50%;
        background:radial-gradient(closest-side,rgba(255,195,0,.30),transparent 70%);filter:blur(20px)}
  #glow2{position:absolute;bottom:-420px;right:-300px;width:1100px;height:1100px;border-radius:50%;
         background:radial-gradient(closest-side,rgba(252,163,17,.20),transparent 70%);filter:blur(24px)}
  #grid{position:absolute;inset:-200px;opacity:.16;
        background-image:linear-gradient(rgba(62,92,118,.55) 1px,transparent 1px),
                         linear-gradient(90deg,rgba(62,92,118,.55) 1px,transparent 1px);
        background-size:128px 128px}
  .ghost{position:absolute;top:300px;left:-80px;font-family:Sora,sans-serif;font-weight:800;
         font-size:460px;line-height:1;color:#fff;opacity:.030;white-space:nowrap;letter-spacing:-.03em}
  #grain{position:absolute;inset:0;opacity:.05;
         background-image:radial-gradient(rgba(255,255,255,.9) 1px,transparent 1px);background-size:3px 3px}

  .stage{position:absolute;inset:0;display:flex;flex-direction:column;
         align-items:center;justify-content:center;text-align:center;padding:0 140px}
  .kicker{font-family:"JetBrains Mono",monospace;font-weight:600;font-size:30px;letter-spacing:.42em;
          text-transform:uppercase;color:var(--accent);margin-bottom:34px}
  .headline{font-family:Sora,sans-serif;font-weight:800;font-size:172px;line-height:.98;
            letter-spacing:-.035em;color:var(--fg);text-shadow:0 24px 70px rgba(0,0,0,.6)}
  .headline em{font-style:normal;color:var(--accent);
               text-shadow:0 0 60px rgba(255,195,0,.45),0 24px 70px rgba(0,0,0,.6)}
  .rule{width:220px;height:5px;border-radius:3px;margin:44px 0 34px;
        background:linear-gradient(90deg,var(--accent),var(--accent2));transform-origin:center}
  .sub{font-size:40px;font-weight:500;color:var(--muted);max-width:1180px;line-height:1.4}
  .brand{margin-top:52px;font-family:Sora,sans-serif;font-weight:800;font-size:66px;letter-spacing:-.02em}
  .brand .dot{color:var(--accent);text-shadow:0 0 50px rgba(255,195,0,.5)}
  .url{margin-top:16px;font-family:"JetBrains Mono",monospace;font-size:30px;color:var(--muted)}

  .corner{position:absolute;width:120px;height:120px;border:5px solid var(--accent);opacity:.5}
  #c1{top:80px;left:80px;border-right:0;border-bottom:0}
  #c2{bottom:80px;right:80px;border-left:0;border-top:0}
  #progress{position:absolute;left:0;bottom:0;height:8px;width:100%;transform-origin:left center;
            background:linear-gradient(90deg,var(--accent),var(--accent2))}
</style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080">
    <div class="bg-layer" data-layout-ignore>
      <div id="glow"></div><div id="glow2"></div><div id="grid"></div>
      <div class="ghost" id="ghost" data-layout-ignore>OTIMIZEVIDEO</div>
      <div id="grain"></div>
    </div>

    <div class="corner" id="c1" data-layout-ignore></div>
    <div class="corner" id="c2" data-layout-ignore></div>

    <section class="stage clip" id="stage" data-start="0" data-duration="4.6" data-track-index="1">
      <div class="kicker" id="kicker">Gostou do corte?</div>
      <h1 class="headline" id="headline">SIGA O <em>CANAL</em></h1>
      <div class="rule" id="rule"></div>
      <p class="sub" id="sub">Vídeo longo virando dois minutos, toda semana.</p>
      <div class="brand" id="brand">INEMA<span class="dot">.CLUB</span></div>
      <div class="url" id="url">🌐 inema.club</div>
    </section>

    <div id="progress" data-layout-ignore></div>
    <audio id="narr" data-start="0.55" data-duration="3.32" data-track-index="20" src="assets/audio/cta.wav"></audio>

    <script src="assets/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const TOTAL = 4.6;
      const tl = gsap.timeline({ paused: true });
      const rep = (cycle) => Math.max(0, Math.floor(TOTAL / cycle) - 1);

      // ambiente: o fundo nunca fica parado (regra do house-style)
      tl.to("#glow",  {scale:1.20, opacity:.55, duration:3.0, yoyo:true, repeat:rep(3.0), ease:"sine.inOut"}, 0);
      tl.to("#glow2", {scale:1.15, duration:3.8, yoyo:true, repeat:rep(3.8), ease:"sine.inOut"}, 0);
      tl.to("#ghost", {x:90, duration:TOTAL, ease:"none"}, 0);
      tl.to("#grid",  {backgroundPositionX:"+=64", backgroundPositionY:"+=64", duration:TOTAL, ease:"none"}, 0);
      tl.fromTo("#progress", {scaleX:0}, {scaleX:1, duration:TOTAL, ease:"none"}, 0);

      // entrada escalonada (stagger 0.08–0.14s, easing-assinatura)
      tl.fromTo("#kicker",   {opacity:0, y:26},          {opacity:1, y:0, duration:.55, ease:"power3.out"}, 0.10);
      tl.fromTo("#headline", {opacity:0, y:56, scale:.94},{opacity:1, y:0, scale:1, duration:.75, ease:"power3.out"}, 0.24);
      tl.fromTo("#rule",     {scaleX:0},                  {scaleX:1, duration:.55, ease:"power2.out"}, 0.62);
      tl.fromTo("#sub",      {opacity:0, y:22},           {opacity:1, y:0, duration:.55, ease:"power2.out"}, 0.74);
      tl.fromTo("#brand",    {opacity:0, y:22},           {opacity:1, y:0, duration:.6,  ease:"power3.out"}, 0.92);
      tl.fromTo("#url",      {opacity:0},                 {opacity:1, duration:.5, ease:"power1.out"}, 1.10);

      // atividade no meio: o âmbar respira e a régua pulsa (ritmo >= 3 eventos)
      tl.to("#headline em", {textShadow:"0 0 90px rgba(255,195,0,.75), 0 24px 70px rgba(0,0,0,.6)",
                             duration:1.0, yoyo:true, repeat:1, ease:"sine.inOut"}, 1.6);
      tl.to("#rule", {scaleX:1.18, duration:.9, yoyo:true, repeat:1, ease:"sine.inOut"}, 2.1);
      tl.to("#c1", {opacity:.85, duration:1.2, yoyo:true, repeat:1, ease:"sine.inOut"}, 1.4);
      tl.to("#c2", {opacity:.85, duration:1.2, yoyo:true, repeat:1, ease:"sine.inOut"}, 1.8);

      // saída
      tl.to("#stage", {opacity:0, duration:.45, ease:"power2.in"}, TOTAL - 0.45);
      tl.set("#stage", {opacity:0}, TOTAL);
      tl.set({}, {}, TOTAL);
      window.__timelines["main"] = tl;
    </script>
  </div>
</body>
</html>
