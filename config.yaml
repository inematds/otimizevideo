transcricao: groq          # groq | whisper_local | whisperx
visual: local              # local | glm | gemini | claude_cli
pontuacao: glm             # glm | gemini | ollama | claude_cli
tts: inemavox              # inemavox | elevenlabs
voz: rachel                # voz da narração (inemavox: rachel, bella, nei, nei2…)
tts_engine: chatterbox     # chatterbox | chatterbox-vc | edge
cta: assets/cta.mp4        # clipe fixo colado no fim de todo render ('' desliga)
fade_final_s: 0.8          # fade de saída do corpo, antes do CTA entrar
imagem: fal                # fal (flux-2-klein) — só usado no modo A+ (--substituir gerado)
modelos:
  glm: z-ai/glm-5.3-flash
  gemini: google/gemini-2.5-flash-lite
  ollama: qwen3.8:27b
  whisper_local: turbo
  claude_cli: sonnet
  fal_imagem: fal-ai/flux-2/klein/9b
openrouter:
  reasoning_effort: low
  max_tokens: 20000
selecao:
  alvo_s: 120
  tolerancia: 0.25
  min_segmento_s: 3
  min_segmento_ideal_s: 8
  pausa_fronteira_ms: 400
  folga_ms: 120
  cota_topico_pct: 40
  nota_minima: 5
  max_unidade_s: 12
saida: ~/projetos/output/otimizevideo
trabalho: trabalho
